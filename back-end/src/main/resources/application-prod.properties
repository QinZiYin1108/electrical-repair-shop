# ==========================================
# 生产环境 — 通过 .env / 环境变量注入
# 启动: SPRING_PROFILES_ACTIVE=prod
# ==========================================

# ---- 数据库 ----
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}

# ---- Redis ----
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}

# ---- JWT ----
security.jwt.secret=${JWT_SECRET}
security.jwt.expire-seconds=${JWT_EXPIRE_SECONDS:2592000}

# ---- 邮件 ----
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# ---- 阿里云 OSS ----
aliyun.oss.endpoint=${ALIYUN_OSS_ENDPOINT}
aliyun.oss.bucket-name=${ALIYUN_OSS_BUCKET_NAME}
aliyun.oss.access-key-id=${ALIYUN_OSS_ACCESS_KEY_ID}
aliyun.oss.access-key-secret=${ALIYUN_OSS_ACCESS_KEY_SECRET}

# ---- 阿里云 AI 安全护栏（内容安全） ----
aliyun.access-key-id=${ALIYUN_GREEN_ACCESS_KEY_ID:${ALIYUN_OSS_ACCESS_KEY_ID}}
aliyun.access-key-secret=${ALIYUN_GREEN_ACCESS_KEY_SECRET:${ALIYUN_OSS_ACCESS_KEY_SECRET}}
aliyun.green.endpoint=${ALIYUN_GREEN_ENDPOINT:green-cip.cn-shanghai.aliyuncs.com}

# ---- 微信小程序 ----
wx.mini.appid=${WX_MINI_APPID}
wx.mini.secret=${WX_MINI_SECRET}

# ---- 微信支付 API v3 ----
payment.wechat.enabled=${WX_PAY_ENABLED:false}
payment.wechat.app-id=${WX_PAY_APPID:${WX_MINI_APPID}}
payment.wechat.merchant-id=${WX_PAY_MCH_ID:}
payment.wechat.merchant-serial-number=${WX_PAY_MERCHANT_SERIAL_NUMBER:}
payment.wechat.private-key-path=${WX_PAY_PRIVATE_KEY_PATH:}
payment.wechat.api-v3-key=${WX_PAY_API_V3_KEY:}
payment.wechat.public-key-id=${WX_PAY_PUBLIC_KEY_ID:}
payment.wechat.public-key-path=${WX_PAY_PUBLIC_KEY_PATH:}
payment.wechat.notify-url=${WX_PAY_NOTIFY_URL:}
payment.wechat.refund-notify-url=${WX_PAY_REFUND_NOTIFY_URL:}

# ---- 腾讯云 SMS ----
tencent.sms.secret-id=${TENCENT_SMS_SECRET_ID}
tencent.sms.secret-key=${TENCENT_SMS_SECRET_KEY}
tencent.sms.sdk-app-id=${TENCENT_SMS_SDK_APP_ID}
tencent.sms.sign-name=${TENCENT_SMS_SIGN_NAME}
tencent.sms.login-template-id=${TENCENT_SMS_LOGIN_TEMPLATE_ID}
tencent.sms.reset-password-template-id=${TENCENT_SMS_RESET_PASSWORD_TEMPLATE_ID}
tencent.sms.change-phone-template-id=${TENCENT_SMS_CHANGE_PHONE_TEMPLATE_ID}

# ---- 腾讯地图 ----
tencent.map.key=${TENCENT_MAP_KEY}

# ---- 应用 ----
app.base-url=${APP_BASE_URL}
app.door-qr.base-url=${APP_DOOR_QR_BASE_URL:${app.base-url}${server.servlet.context-path}/pass/door-qr/scan}

# ---- 日志 ----
logging.level.root=${LOG_LEVEL_ROOT:info}
logging.level.com.example.backend=${LOG_LEVEL_BACKEND:warn}
logging.level.com.baomidou.mybatisplus=${LOG_LEVEL_MYBATIS:warn}

# ---- Web 安全与内部管理端点 ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
content-check.failure-policy=${CONTENT_CHECK_FAILURE_POLICY:quarantine}
