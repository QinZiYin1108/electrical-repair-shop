spring.application.name=back-end
spring.profiles.default=local

# ===== 服务器（固定） =====
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===== 数据库驱动（固定） =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis-Plus（固定） =====
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.example.backend.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=INPUT
mybatis-plus.global-config.db-config.logic-delete-field=isDelete
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ===== Jackson（固定） =====
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=true

# ===== 邮件服务器信息（固定） =====
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# ===== 文件上传（固定） =====
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=35MB
