spring.application.name=back-end
server.port=8080
server.servlet.context-path=/api
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/appdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:your_password}

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.example.backend.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=INPUT
mybatis-plus.global-config.db-config.logic-delete-field=isDelete
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

logging.level.root=info
logging.level.com.example.backend=debug
logging.level.com.baomidou.mybatisplus=debug

spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=true

security.jwt.secret=${JWT_SECRET:your_jwt_secret}
security.jwt.expire-seconds=2592000

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:your_mail_username}
spring.mail.password=${MAIL_PASSWORD:your_mail_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

aliyun.oss.endpoint=oss-cn-beijing.aliyuncs.com
aliyun.oss.bucket-name=leonyin-blog
aliyun.oss.access-key-id=${ALIYUN_OSS_ACCESS_KEY_ID:your_access_key_id}
aliyun.oss.access-key-secret=${ALIYUN_OSS_ACCESS_KEY_SECRET:your_access_key_secret}

wx.mini.appid=${WX_MINI_APPID:your_wx_appid}
wx.mini.secret=${WX_MINI_SECRET:your_wx_secret}

#  Web API
baidu.map.ak=${BAIDU_MAP_AK:your_baidu_map_ak}

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=35MB
