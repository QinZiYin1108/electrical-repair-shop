spring.application.name=back-end
spring.profiles.default=local

# ===== 服务器（固定） =====
server.port=8081
server.servlet.context-path=/api
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===== 数据库驱动（固定） =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis-Plus（固定） =====
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.example.backend.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=INPUT
mybatis-plus.global-config.db-config.logic-delete-field=isDelete
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ===== Jackson（固定） =====
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=true

# ===== 外部支付（默认关闭） =====
payment.wechat.enabled=false

# ===== Flyway 数据库迁移（默认关闭，仅在生产显式开启）=====
# 启用前请先备份数据库。已有库由 baseline-on-migrate 在版本 1 建立基线（不会重跑 V1）；
# 全新库会从 V1__baseline.sql 建库。增量改动以 V2、V3… 追加。
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===== 可靠通知 outbox（固定） =====
# 业务事务只写 outbox，后台发送器异步投递；失败指数退避，超过最大次数进入死信。
notification.outbox.max-retry=5
notification.outbox.batch-size=100
# 短信通知渠道默认关闭（站内通知 IN_APP 始终可用）
notification.sms.enabled=${NOTIFICATION_SMS_ENABLED:false}

# ===== 订单 SLA 超时引擎（固定） =====
# 以订单进入当前状态的时间为基准；超时提醒责任方，超过提醒 2 倍升级给管理员。
order.sla.accept.remind-minutes=30
order.sla.accept.cancel-minutes=120
order.sla.visit.remind-minutes=240
order.sla.inspection.remind-minutes=120
order.sla.payment.remind-minutes=1440
order.sla.completion.remind-minutes=1440
order.sla.scan-batch-size=200
# 升级时接收通知的管理员账号ID（为空则不发送管理员站内通知）
order.sla.admin-account-id=${ORDER_SLA_ADMIN_ACCOUNT_ID:}

# ===== 客服工单（固定） =====
# 关联金额超过阈值的工单进入待审批，需双人审批（审批人不能为创建人）。
support.ticket.approval-amount-threshold=1000
support.ticket.default-due-hours=24

# ===== 发票与财务核算（固定） =====
# 佣金率/税率默认 0（不改变既有结算），仅用于财务快照与报表展示。
finance.commission-rate=0
finance.tax-rate=0

# ===== 维修人员提现风控（固定） =====
# 单笔达到阈值的提现需超管复核确认后方可打款；日累计超过限额拒绝申请。
withdrawal.review-threshold=5000
withdrawal.daily-limit=50000

# ===== 邮件服务器信息（固定） =====
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# ===== 腾讯云 SMS（固定） =====
tencent.sms.endpoint=sms.tencentcloudapi.com

# ===== 腾讯云 FaceID 人脸核身（固定） =====
tencent.faceid.endpoint=faceid.tencentcloudapi.com

# ===== 文件上传（固定） =====
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=35MB

# ===== Actuator（固定） =====
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
