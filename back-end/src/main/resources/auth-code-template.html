<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>验证码</title>
</head>
<body style="margin:0;padding:0;background:#f5f6f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f6f7;padding:24px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 4px 12px rgba(15,35,52,0.08);">
                <tr>
                    <td style="padding:24px 32px 16px;background:linear-gradient(135deg,#409eff,#7ec8ff);color:#ffffff;">
                        <div style="font-size:24px;font-weight:600;">电器维修平台</div>
                        <div style="margin-top:8px;font-size:14px;opacity:0.9;">安全验证</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px 32px 8px;color:#303133;font-size:14px;">
                        <div style="font-size:16px;font-weight:500;margin-bottom:12px;">您好：</div>
                        <div>您正在使用邮箱验证码服务，本次验证码为：</div>
                        <div style="margin:20px 0;text-align:center;">
                            <span style="display:inline-block;padding:12px 24px;border-radius:6px;background:#f2f6fc;border:1px solid #dcdfe6;font-size:24px;font-weight:600;letter-spacing:4px;color:#409eff;">
                                {{code}}
                            </span>
                        </div>
                        <div style="color:#606266;line-height:1.8;">
                            为了您的账号安全，请在
                            <strong style="color:#f56c6c;">{{expireMinutes}}</strong>
                            分钟内完成验证，请勿将验证码透露给他人。
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 32px 24px;color:#909399;font-size:12px;border-top:1px solid #ebeef5;">
                        <div style="margin-bottom:4px;">如果这不是您本人的操作，请忽略此邮件。</div>
                        <div>本邮件由系统自动发送，请勿直接回复。</div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
