spring.application.name=back-end

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ---- 数据库 ----
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/electrical_repair_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# ---- MyBatis-Plus ----
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.example.backend.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=INPUT
mybatis-plus.global-config.db-config.logic-delete-field=isDelete
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ---- Redis ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}

# ---- JWT ----
security.jwt.secret=${JWT_SECRET:local-dev-jwt-secret}
security.jwt.expire-seconds=${JWT_EXPIRE_SECONDS:2592000}

# ---- 邮件 ----
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# ---- 阿里云 OSS ----
aliyun.oss.endpoint=${ALIYUN_OSS_ENDPOINT:}
aliyun.oss.bucket-name=${ALIYUN_OSS_BUCKET_NAME:}
aliyun.oss.access-key-id=${ALIYUN_OSS_ACCESS_KEY_ID:}
aliyun.oss.access-key-secret=${ALIYUN_OSS_ACCESS_KEY_SECRET:}

# ---- 微信小程序 ----
wx.mini.appid=${WX_MINI_APPID:}
wx.mini.secret=${WX_MINI_SECRET:}

# ---- 百度地图 ----
baidu.map.ak=${BAIDU_MAP_AK:}

# ---- 日志 ----
logging.level.root=info
logging.level.com.example.backend=debug
logging.level.com.baomidou.mybatisplus=debug

# ---- Jackson ----
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=true

# ---- 文件上传 ----
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=35MB
