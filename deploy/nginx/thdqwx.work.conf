# thdqwx.work — Nginx 站点（Let's Encrypt 证书）
# 面向 Debian 13 (nginx 1.26)：使用 http2 on; 新语法（旧 listen ... http2 会告警）。
# 由 deploy/setup-nginx-ssl.sh 安装为 /etc/nginx/conf.d/thdqwx.work.conf

# ---- 80：全量跳转 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name thdqwx.work www.thdqwx.work admin.thdqwx.work api.thdqwx.work;
    return 301 https://$host$request_uri;
}

# ---- 官网 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.thdqwx.work;

    ssl_certificate     /etc/letsencrypt/live/thdqwx.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thdqwx.work/privkey.pem;

    ssl_session_timeout 10m;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /opt/electrical-repair-shop/official-website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

# ---- 后台 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.thdqwx.work;

    ssl_certificate     /etc/letsencrypt/live/thdqwx.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thdqwx.work/privkey.pem;

    ssl_session_timeout 10m;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /opt/electrical-repair-shop/admin-front-end;
    index index.html;

    client_max_body_size 35m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

# ---- API 后端 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.thdqwx.work;

    ssl_certificate     /etc/letsencrypt/live/thdqwx.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thdqwx.work/privkey.pem;

    ssl_session_timeout 10m;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 35m;

    location / {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ---- 根域 → www ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thdqwx.work;

    ssl_certificate     /etc/letsencrypt/live/thdqwx.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thdqwx.work/privkey.pem;

    return 301 https://www.thdqwx.work$request_uri;
}
