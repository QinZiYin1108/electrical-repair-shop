# ==========================================
# 环境相关配置（本地和生产都用这个 profile）
# 启动方式: SPRING_PROFILES_ACTIVE=prod
# 所有值通过 .env / 环境变量提供
# ==========================================

# ---- 数据库 ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}

# ---- Redis ----
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}

# ---- JWT ----
security.jwt.secret=${JWT_SECRET}
security.jwt.expire-seconds=${JWT_EXPIRE_SECONDS:2592000}

# ---- 邮件 ----
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# ---- 阿里云 OSS ----
aliyun.oss.endpoint=${ALIYUN_OSS_ENDPOINT}
aliyun.oss.bucket-name=${ALIYUN_OSS_BUCKET_NAME}
aliyun.oss.access-key-id=${ALIYUN_OSS_ACCESS_KEY_ID}
aliyun.oss.access-key-secret=${ALIYUN_OSS_ACCESS_KEY_SECRET}

# ---- 微信小程序 ----
wx.mini.appid=${WX_MINI_APPID}
wx.mini.secret=${WX_MINI_SECRET}

# ---- 百度地图 ----
baidu.map.ak=${BAIDU_MAP_AK}

# ---- 日志 ----
logging.level.root=${LOG_LEVEL_ROOT:info}
logging.level.com.example.backend=${LOG_LEVEL_BACKEND:debug}
logging.level.com.baomidou.mybatisplus=${LOG_LEVEL_MYBATIS:debug}
