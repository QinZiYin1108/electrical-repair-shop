# Production profile. Start with: SPRING_PROFILES_ACTIVE=prod
# Values without defaults must be provided by environment variables.

spring.application.name=${APP_NAME:back-end}
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}

mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.example.backend.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=INPUT
mybatis-plus.global-config.db-config.logic-delete-field=isDelete
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

logging.level.root=${LOG_LEVEL_ROOT:info}
logging.level.com.example.backend=${LOG_LEVEL_BACKEND:info}
logging.level.com.baomidou.mybatisplus=${LOG_LEVEL_MYBATIS:warn}

spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=true

security.jwt.secret=${JWT_SECRET}
security.jwt.expire-seconds=${JWT_EXPIRE_SECONDS:2592000}

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:3s}

spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:true}

aliyun.oss.endpoint=${ALIYUN_OSS_ENDPOINT}
aliyun.oss.bucket-name=${ALIYUN_OSS_BUCKET_NAME}
aliyun.oss.access-key-id=${ALIYUN_OSS_ACCESS_KEY_ID}
aliyun.oss.access-key-secret=${ALIYUN_OSS_ACCESS_KEY_SECRET}

wx.mini.appid=${WX_MINI_APPID}
wx.mini.secret=${WX_MINI_SECRET}

baidu.map.ak=${BAIDU_MAP_AK}

app.door-qr.base-url=${APP_DOOR_QR_BASE_URL}

spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:30MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:35MB}
